<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chatterhub-icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChatterHub - Connect with friends, share your moments, and stay updated with conversations that matter." />
    <meta name="theme-color" content="#6b5fb0" />
    <title>ChatterHub - Connect & Share</title>
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
      /* Loading Screen Styles */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6b5fb0 0%, #4a3f8a 50%, #ff6ba9 100%);
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loading-content {
        text-align: center;
        color: white;
      }

      .loading-logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 24px;
        animation: pulse 2s ease-in-out infinite;
      }

      .loading-logo img {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
      }

      .loading-title {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 16px;
        background: linear-gradient(to right, #ffffff, #ff9ec4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .loading-spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* Floating blobs */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.3;
        animation: float 7s ease-in-out infinite;
      }

      .blob-1 {
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.3);
        top: 10%;
        left: 10%;
      }

      .blob-2 {
        width: 250px;
        height: 250px;
        background: rgba(255, 107, 169, 0.4);
        top: 50%;
        right: 10%;
        animation-delay: 2s;
      }

      .blob-3 {
        width: 200px;
        height: 200px;
        background: rgba(139, 127, 199, 0.4);
        bottom: 10%;
        left: 30%;
        animation-delay: 4s;
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        33% { transform: translate(30px, -30px); }
        66% { transform: translate(-20px, 20px); }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="app-loading">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="loading-content">
        <div class="loading-logo">
          <img src="/chatterhub-logo.svg" alt="ChatterHub Logo" />
        </div>
        <h1 class="loading-title">ChatterHub</h1>
        <div class="loading-spinner"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loading screen when app is ready
      window.addEventListener('load', () => {
        const loader = document.getElementById('app-loading');
        if (loader) {
          setTimeout(() => {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 300);
          }, 500);
        }
      });
    </script>
  </body>
</html>
